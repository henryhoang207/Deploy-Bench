// Root build file. Versions are pinned deliberately conservative: this build
// has to work once, on the user's machine, without a debugging session.
// Bumping is cheap; a version-skew failure mid-Phase-3 is not.
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
